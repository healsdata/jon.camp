{{ define "main" }}
  {{- $posts := where site.RegularPages "Section" "!=" "links" }}
  {{- $recent := sort $posts ".Date" "desc" | first 5 }}

  <div class="homepage-feed">
    {{- range $recent }}
      {{ partial "post-card.html" (dict "Page" .) }}
    {{- end }}

    <div class="feed-more-links">
      <a href="/blog/">More Posts &rarr;</a>
    </div>
  </div>
{{ end }}
